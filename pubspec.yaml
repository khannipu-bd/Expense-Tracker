name: expense_tracker
description: "Hisably - Professional Expense Tracker Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & Navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Database & Storage
  drift: ^2.24.2
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.29

  # Charts & Visuals
  fl_chart: ^0.70.2

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  shared_preferences: ^2.5.1
  path_provider: ^2.1.5
  path: ^1.9.1
  file_picker: ^8.1.7
  share_plus: ^10.1.4

  # Security & Export
  local_auth: ^2.3.0
  pdf: ^3.11.1
  printing: ^5.13.4
  excel: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.24.2
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
    - assets/images/
